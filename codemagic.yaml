# Codemagic CI/CD for the Flutter app. Nothing here contains secrets: create the variable groups
# "cctv_android" and "cctv_build" in Codemagic (Teams > Global variables and secrets).
#
#  cctv_build:   API_BASE_URL (your deployed backend, https://...), PRIVACY_URL, TERMS_URL
#  cctv_android: KEYSTORE_B64 (base64 of the upload keystore, secure), KEYSTORE_PASSWORD (secure),
#                KEY_ALIAS, KEY_PASSWORD (secure)
#  Optional (Play upload): GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (secure) in the cctv_play group.
workflows:
  android-debug:
    name: Android APK - release, split per ABI (every push)
    working_directory: mobile_app
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - cctv_build
    triggering:
      events: [push, pull_request]
      branch_patterns:
        - { pattern: "*", include: true }
    scripts:
      - name: Prepare Android project
        script: bash scripts/prepare_android.sh
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos
      - name: Unit tests
        script: flutter test
      # Release mode is far smaller and faster than debug (debug APKs are ~170 MB). --split-per-abi makes one small APK
      # per CPU type: install app-arm64-v8a-release.apk on almost every modern phone (armeabi-v7a for very old 32-bit ones).
      # Signed with the debug key here, so it installs for testing; the Play Store build uses the real upload key (android-release).
      - name: Build release APKs (split per ABI)
        script: flutter build apk --release --split-per-abi --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=PRIVACY_URL="$PRIVACY_URL" --dart-define=TERMS_URL="$TERMS_URL"
    artifacts:
      # Listed three ways because the base directory for patterns differs when working_directory is set.
      - $CM_BUILD_DIR/mobile_app/build/app/outputs/flutter-apk/*.apk
      - mobile_app/build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      # Codemagic emails a download link for the APK to this address when the build succeeds.
      email:
        recipients:
          - s.ansari.it@gmail.com
        notify:
          success: true
          failure: false

  android-release:
    name: Android release AAB (manual / tags)
    working_directory: mobile_app
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      groups:
        - cctv_build
        - cctv_android
    triggering:
      events: [tag]
      tag_patterns:
        - { pattern: "v*", include: true }
    scripts:
      - name: Prepare Android project
        script: bash scripts/prepare_android.sh
      - name: Get packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Restore upload keystore
        script: |
          echo "$KEYSTORE_B64" | base64 --decode > "$CM_BUILD_DIR/upload.jks"
          echo "KEYSTORE_PATH=$CM_BUILD_DIR/upload.jks" >> "$CM_ENV"
      - name: Build release AAB
        script: |
          flutter build appbundle --release \
            --build-number="$((BUILD_NUMBER))" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=PRIVACY_URL="$PRIVACY_URL" \
            --dart-define=TERMS_URL="$TERMS_URL"
      - name: Sign with upload key
        script: bash scripts/sign_aab.sh
    artifacts:
      - $CM_BUILD_DIR/mobile_app/build/app/outputs/bundle/release/*.aab
      - mobile_app/build/app/outputs/bundle/release/*.aab
      - build/app/outputs/bundle/release/*.aab
    # Publishing to Google Play is intentionally NOT automated. Upload the AAB to an internal/closed
    # testing track by hand, and promote to production only with the owner's approval.
